workflows:
  android-workflow:
    name: Android build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      # Create this group in Codemagic → Environment variables, with
      # SUPABASE_URL and SUPABASE_ANON_KEY (the real values from your local
      # mobile-app/.env), both marked Secure, and attach it to this
      # workflow. See docs/database.md / mobile-app/.env.example for what
      # these are.
      groups:
        - supabase
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    scripts:
      # pubspec.yaml declares `.env` as a bundled asset (flutter_dotenv) but
      # it's gitignored on purpose — it holds real Supabase credentials, so
      # it only ever exists on a dev machine, never in git. Without this
      # step the build fails immediately with "No file or variants found
      # for asset: .env" before any Dart code even compiles.
      - name: Write .env from CI secrets
        script: |
          set -e
          cd mobile-app
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Get Flutter packages
        script: |
          set -e
          cd mobile-app
          flutter pub get

      # Same gate this repo's own testing convention already enforces
      # locally (see CLAUDE.md / docs/tasks-completed.md) — fail fast
      # before spending build minutes on a build that was never going to
      # be correct.
      - name: Flutter analyze
        script: |
          set -e
          cd mobile-app
          flutter analyze

      - name: Flutter test
        script: |
          set -e
          cd mobile-app
          flutter test

      # Debug build to match what was already being run manually. To build
      # a real, installable release instead:
      #   1. Add the release keystore to Codemagic's encrypted file storage
      #      and android/key.properties' three secrets (storePassword,
      #      keyPassword, keyAlias) as environment variables.
      #   2. Write both out to disk in a script step here, the same way
      #      .env is written above.
      #   3. Change the command below to `flutter build appbundle --release`.
      # Without that, `--release` still succeeds but falls back to debug
      # signing (see android/app/build.gradle.kts) — fine for CI smoke
      # testing, not for uploading to Play Console.
      - name: Build appbundle (debug)
        script: |
          set -e
          cd mobile-app
          flutter build appbundle --debug

    artifacts:
      - mobile-app/build/**/outputs/**/*.aab
      - mobile-app/build/**/outputs/**/*.apk
