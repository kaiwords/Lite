openapi: 3.0.3
info:
  title: Literature API
  version: "1.0.0"
  description: |
    There is no bespoke API server for this project — `mobile-app/` talks
    directly to a Supabase-managed Postgres project. This spec documents
    that real, live backend surface: the auto-generated PostgREST REST API
    (one CRUD path per table, matching `lib/services/*_repository.dart`)
    plus the Supabase Auth endpoints the app's login/signup screens call
    through the `supabase_flutter` SDK.

    Generated from the live schema (`information_schema.columns` and
    `pg_policies` on the `public` schema) rather than hand-guessed — see
    [`database.md`](database.md) for the narrative version of what's real
    vs. still mocked, and [`CLAUDE.md`](../CLAUDE.md) for the standing
    instruction to keep this file in sync with schema changes.

    **Auth model**: every request needs both an `apikey` header (the
    project's publishable/anon key — see `mobile-app/.env.example`) and an
    `Authorization: Bearer <jwt>` header (the signed-in user's session
    token, or the same anon key for unauthenticated reads where RLS allows
    it). Row-level security is enabled on every table below; the
    per-endpoint `description` notes what it actually restricts.

servers:
  - url: "https://{project_ref}.supabase.co"
    variables:
      project_ref:
        default: your-project-ref
        description: >-
          Supabase project ref — see SUPABASE_URL in mobile-app/.env
          (mobile-app/.env.example shows the placeholder format; the real
          value is a live secret, never committed).

security:
  - apiKeyAuth: []
    bearerAuth: []

tags:
  - name: Auth
    description: Supabase Auth (email/password) — not custom to this app, but what login_screen.dart/signup_screen.dart call.
  - name: users
  - name: posts
  - name: post_pages
  - name: comments
  - name: marketplace_listings
  - name: ebook_chapters
  - name: audio_volumes
  - name: follows
  - name: conversations
  - name: messages
  - name: user_stripe_accounts
  - name: orders
  - name: order_items
  - name: Stripe Edge Functions
    description: >-
      The app's only server-side code (Deno, in supabase/functions/) —
      everything else is direct PostgREST/Auth access. These exist because
      Stripe's secret key, checkout amount validation, and Connect payout
      splitting can't live in the client. See CLAUDE.md's swagger.yaml
      sync rule and docs/database.md.
  - name: Edge Functions
    description: >-
      Added 2026-08-13. Non-Stripe server-side code (Deno, in
      supabase/functions/) — exists because order_items has no direct
      UPDATE RLS policy for authenticated users (writing to it always goes
      through the service role, to stop a seller rewriting their own
      unit_price_cents/platform_fee_cents/transfer_status).

paths:
  # ── Auth ─────────────────────────────────────────────────────────────────
  /auth/v1/signup:
    post:
      tags: [Auth]
      summary: Create an account (email/password)
      description: Called by signup_screen.dart via `Supabase.instance.client.auth.signUp`.
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Session + user created }
        "400": { description: Invalid email/password, or email already registered }

  /auth/v1/token:
    post:
      tags: [Auth]
      summary: Sign in (grant_type=password) or refresh a session
      description: Called by login_screen.dart via `Supabase.instance.client.auth.signInWithPassword`.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - name: grant_type
          in: query
          required: true
          schema: { type: string, enum: [password, refresh_token] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                refresh_token: { type: string }
      responses:
        "200": { description: Session issued }
        "400": { description: Invalid credentials — humanized client-side by utils/auth_error.dart }

  /auth/v1/logout:
    post:
      tags: [Auth]
      summary: Sign out (invalidate the current session)
      security: [{ apiKeyAuth: [], bearerAuth: [] }]
      responses:
        "204": { description: Signed out }

  # ── users ────────────────────────────────────────────────────────────────
  /rest/v1/users:
    get:
      tags: [users]
      summary: List/filter users
      description: >-
        RLS: public read. Called by users_repository.dart and
        LitUser.fromSupabaseRow's caller in app.dart on every sign-in.
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    patch:
      tags: [users]
      summary: Update the signed-in user's own profile row
      description: "RLS: only the row where id = auth.uid() (\"own row update\") — no insert/delete policy exists, rows are provisioned on signup."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
      responses:
        "204": { description: Updated }
        "403": { description: RLS rejected — not your row }

  # ── posts ────────────────────────────────────────────────────────────────
  /rest/v1/posts:
    get:
      tags: [posts]
      summary: List/filter posts
      description: "RLS: public read. See posts_repository.dart / feed_provider.dart's loadFromSupabase()."
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Post" } }
    post:
      tags: [posts]
      summary: Create a post
      description: "RLS: insert only where author_id = auth.uid(). See PostsNotifier.addPost."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Post" }
      responses:
        "201": { description: Created }
        "403": { description: RLS rejected — author_id must match the signed-in user }
    patch:
      tags: [posts]
      summary: Update a post
      description: "RLS: only rows where author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Post" }
      responses:
        "204": { description: Updated }
    delete:
      tags: [posts]
      summary: Delete a post
      description: "RLS: only rows where author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── post_pages ───────────────────────────────────────────────────────────
  /rest/v1/post_pages:
    get:
      tags: [post_pages]
      summary: List additional pages for a post
      description: >-
        RLS: public read. Extra pages beyond a post's main title/content,
        added while writing (PostScreen's "Add page"). Each page's `title`
        is nullable — the writer is prompted per page whether to keep
        showing a title or not. See posts_repository.dart's fetchAll
        (joined as `post_pages(*)`) and PostPage in models/post.dart.
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: post_id
          in: query
          schema: { type: string }
          example: "eq.p1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PostPage" } }
    post:
      tags: [post_pages]
      summary: Add a page to a post
      description: "RLS: only where the parent post's author_id = auth.uid(). See PostsRepository.insert."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostPage" }
      responses:
        "201": { description: Created }
    patch:
      tags: [post_pages]
      summary: Update a page
      description: "RLS: only where the parent post's author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [post_pages]
      summary: Remove a page
      description: "RLS: only where the parent post's author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── comments ─────────────────────────────────────────────────────────────
  /rest/v1/comments:
    get:
      tags: [comments]
      summary: List/filter comments
      description: "RLS: public read. See comments_repository.dart."
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: post_id
          in: query
          schema: { type: string }
          example: "eq.p1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Comment" } }
    post:
      tags: [comments]
      summary: Add a comment
      description: "RLS: insert only where author_id = auth.uid(). See CommentsNotifier.add."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Comment" }
      responses:
        "201": { description: Created }
    patch:
      tags: [comments]
      summary: Update a comment
      description: "RLS: only rows where author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [comments]
      summary: Delete a comment
      description: "RLS: only rows where author_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── marketplace_listings ─────────────────────────────────────────────────
  /rest/v1/marketplace_listings:
    get:
      tags: [marketplace_listings]
      summary: List/filter marketplace listings
      description: "RLS: public read. See marketplace_repository.dart / marketplace_provider.dart's loadFromSupabase()."
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MarketplaceListing" } }
    post:
      tags: [marketplace_listings]
      summary: List a new item for sale
      description: "RLS: insert only where seller_id = auth.uid() (server-stamped by column default). See MyListingsNotifier.add."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceListing" }
      responses:
        "201": { description: Created }
    patch:
      tags: [marketplace_listings]
      summary: Update a listing
      description: "RLS: only rows where seller_id = auth.uid(). See MyListingsNotifier.update."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [marketplace_listings]
      summary: Remove a listing
      description: "RLS: only rows where seller_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── ebook_chapters ───────────────────────────────────────────────────────
  /rest/v1/ebook_chapters:
    get:
      tags: [ebook_chapters]
      summary: List chapters for a listing
      description: "RLS: public read."
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: listing_id
          in: query
          schema: { type: string }
          example: "eq.mBook1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EbookChapter" } }
    post:
      tags: [ebook_chapters]
      summary: Add a chapter to a listing
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EbookChapter" }
      responses:
        "201": { description: Created }
    patch:
      tags: [ebook_chapters]
      summary: Update a chapter
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [ebook_chapters]
      summary: Remove a chapter
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── audio_volumes ────────────────────────────────────────────────────────
  /rest/v1/audio_volumes:
    get:
      tags: [audio_volumes]
      summary: List audio tracks for a listing
      description: "RLS: public read."
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: listing_id
          in: query
          schema: { type: string }
          example: "eq.m9"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AudioVolume" } }
    post:
      tags: [audio_volumes]
      summary: Add a track to a listing
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioVolume" }
      responses:
        "201": { description: Created }
    patch:
      tags: [audio_volumes]
      summary: Update a track
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [audio_volumes]
      summary: Remove a track
      description: "RLS: only where the parent listing's seller_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── follows ──────────────────────────────────────────────────────────────
  /rest/v1/follows:
    get:
      tags: [follows]
      summary: List follow relationships
      description: >-
        RLS: public read. See follows_repository.dart. Note: only the
        "who do I follow" direction is queried anywhere in the app today —
        there's no "who follows me" query, so the Followers screen shows
        placeholder data, not a real reverse lookup against this table.
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: follower_id
          in: query
          schema: { type: string }
          example: "eq.u1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Follow" } }
    post:
      tags: [follows]
      summary: Follow a user
      description: "RLS: insert only where follower_id = auth.uid(). See FollowNotifier.follow."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Follow" }
      responses:
        "201": { description: Created }
    delete:
      tags: [follows]
      summary: Unfollow a user
      description: "RLS: only rows where follower_id = auth.uid(). See FollowNotifier.unfollow. No update policy — a follow is created or deleted, never edited."
      parameters:
        - { $ref: "#/components/parameters/idFilter" }
        - name: followee_id
          in: query
          schema: { type: string }
          example: "eq.u2"
      responses:
        "204": { description: Deleted }

  # ── conversations ────────────────────────────────────────────────────────
  /rest/v1/conversations:
    get:
      tags: [conversations]
      summary: List the signed-in user's conversations
      description: "RLS: only rows where owner_id = auth.uid(). See conversations_repository.dart."
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
    post:
      tags: [conversations]
      summary: Start a conversation
      description: "RLS: insert only where owner_id = auth.uid() (server-stamped by column default). See ConversationsRepository.ensureConversation."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Conversation" }
      responses:
        "201": { description: Created }
    patch:
      tags: [conversations]
      summary: Update conversation metadata (e.g. unread state)
      description: "RLS: only rows where owner_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Updated }
    delete:
      tags: [conversations]
      summary: Delete a conversation
      description: "RLS: only rows where owner_id = auth.uid()."
      parameters: [{ $ref: "#/components/parameters/idFilter" }]
      responses:
        "204": { description: Deleted }

  # ── messages ─────────────────────────────────────────────────────────────
  /rest/v1/messages:
    get:
      tags: [messages]
      summary: List messages in a conversation
      description: >-
        RLS: only where the parent conversation's owner_id = auth.uid().
        One-shot fetch — no live/realtime subscription, see
        ConversationsNotifier.loadFromSupabase.
      parameters:
        - { $ref: "#/components/parameters/select" }
        - name: conversation_id
          in: query
          required: true
          schema: { type: string }
          example: "eq.u2"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      tags: [messages]
      summary: Send a message
      description: "RLS: only where the parent conversation's owner_id = auth.uid(). See ConversationsNotifier.sendMessage."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Message" }
      responses:
        "201": { description: Created }

  # ── user_stripe_accounts ────────────────────────────────────────────────
  /rest/v1/user_stripe_accounts:
    get:
      tags: [user_stripe_accounts]
      summary: Get the signed-in user's Stripe identity (buyer + seller)
      description: >-
        RLS: only the row where user_id = auth.uid(). No insert/update/
        delete policy for any client role — every row is written by the
        Edge Functions below using the service-role key, which bypasses
        RLS. See CommerceRepository.fetchSellerStripeStatus and the
        migration comment in supabase/migrations/20260813000001_add_stripe_commerce.sql
        for why this isn't just columns on public.users.
      parameters: [{ $ref: "#/components/parameters/select" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserStripeAccount" } }

  # ── orders ───────────────────────────────────────────────────────────────
  /rest/v1/orders:
    get:
      tags: [orders]
      summary: List the signed-in buyer's orders
      description: >-
        RLS: only rows where buyer_id = auth.uid(). Read-only from the
        client — created and updated only by stripe-create-checkout and
        stripe-webhook (service role). See CommerceRepository.fetchPurchases.
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }

  # ── order_items ──────────────────────────────────────────────────────────
  /rest/v1/order_items:
    get:
      tags: [order_items]
      summary: List order line items visible to the signed-in user
      description: >-
        RLS: rows where seller_id = auth.uid(), OR where the parent order's
        buyer_id = auth.uid() — so this one table serves both
        CommerceRepository.fetchPurchases (buyer side) and
        CommerceRepository.fetchSales (seller side). Read-only from the
        client.
      parameters: [{ $ref: "#/components/parameters/select" }, { $ref: "#/components/parameters/idFilter" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }

  # ── Stripe Edge Functions ───────────────────────────────────────────────
  /functions/v1/stripe-connect-onboarding:
    post:
      tags: [Stripe Edge Functions]
      summary: Start (or resume) the signed-in user's seller Connect onboarding
      description: >-
        Creates a Stripe Express connected account for the user if one
        doesn't exist yet, then returns a one-time Stripe-hosted onboarding
        URL (an Account Link). The client opens it in the system browser —
        Stripe-hosted onboarding doesn't work in an embedded webview. See
        StripeService.startSellerOnboarding and
        supabase/functions/stripe-connect-onboarding.
      security: [{ apiKeyAuth: [], bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, description: "One-time Stripe-hosted onboarding URL." }
        "401": { description: Missing/invalid session }

  /functions/v1/stripe-connect-return:
    get:
      tags: [Stripe Edge Functions]
      summary: Browser landing page after Stripe Connect onboarding
      description: >-
        The return_url and refresh_url that stripe-connect-onboarding hands
        to Stripe. Stripe redirects the seller's browser here with no
        Authorization header, so it must be deployed with verify_jwt = false.
        Returns a static HTML page telling the seller to go back to the app;
        it reads and writes nothing.
      security: []
      responses:
        "200":
          description: Static HTML page
          content:
            text/html:
              schema: { type: string }

  /functions/v1/stripe-create-checkout:
    post:
      tags: [Stripe Edge Functions]
      summary: Create an order + PaymentIntent for one or more listings
      description: >-
        Validates every listing server-side (authoritative price_cents,
        not-your-own-listing, not-already-purchased, seller has finished
        Connect onboarding, and — added 2026-08-13 — a valid shipping
        choice for every Physical listing the seller configured
        shipping_methods on), creates the orders/order_items rows, and
        returns a PaymentIntent client secret for the Flutter Payment
        Sheet. One PaymentIntent covers the whole cart even across
        multiple sellers ("separate charges and transfers" — see the
        function's doc comment); stripe-webhook creates the per-seller
        Transfers afterward. See StripeService.buyListings.
      security: [{ apiKeyAuth: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingIds]
              properties:
                listingIds: { type: array, items: { type: string } }
                shipping:
                  type: object
                  description: >-
                    Added 2026-08-13. Keyed by listing id — the buyer's
                    fulfillment choice for each Physical listing that has
                    shipping_methods configured (collected by
                    widgets/shipping_method_sheet.dart). Omitted/empty when
                    nothing in the cart needs it.
                  additionalProperties:
                    type: object
                    properties:
                      method: { type: string, enum: [pickup, delivery, meetup] }
                      meetupPlace: { type: string, description: "Required when method is 'meetup'." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string }
                  orderId: { type: string, format: uuid }
                  amountTotalCents: { type: integer }
        "400": { description: "Validation error (e.g. seller hasn't finished payment setup, already purchased) — surfaced to the user as-is (the client reads it from FunctionException.details, see invokeEdgeFunction in stripe_service.dart)." }
        "401": { description: Missing/invalid session }

  /functions/v1/stripe-webhook:
    post:
      tags: [Stripe Edge Functions]
      summary: Stripe webhook — reconciles orders/order_items/user_stripe_accounts
      description: >-
        Not called by the app — called by Stripe. Two webhook endpoints
        point here with two different signing secrets (payment_intent.*
        fires on the platform account; account.updated fires on connected
        accounts, which requires a separate `connect: true` endpoint).
        Verified via the Stripe-Signature header, not Supabase auth
        (verify_jwt=false). Idempotent on payment_intent.succeeded — see
        supabase/functions/stripe-webhook.
      security: []
      responses:
        "200": { description: Event handled (or intentionally ignored — unhandled event types are a no-op) }
        "400": { description: Signature verification failed }

  /functions/v1/confirm-meetup:
    post:
      tags: [Edge Functions]
      summary: Seller confirms a Meetup order's suggested place/time
      description: >-
        Added 2026-08-13. Flips order_items.meetup_confirmed to true, after
        checking the caller is that item's seller_id and its
        shipping_method is 'meetup'. Called from sales_tab.dart's "Confirm
        meetup" button — see CommerceRepository.confirmMeetup.
      security: [{ apiKeyAuth: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderItemId]
              properties:
                orderItemId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "400": { description: "orderItemId missing, or the order isn't a meetup" }
        "401": { description: Missing/invalid session }
        "403": { description: "Caller isn't this order item's seller" }
        "404": { description: Order item not found }

  /functions/v1/claim-listing:
    post:
      tags: [Edge Functions]
      summary: Claim a Free or Swap listing — no payment involved
      description: >-
        Added 2026-08-13. Validates the listing is offer 'free' or 'swap',
        not the caller's own, not already claimed (is_sold_out), and (if
        the listing has shipping_methods configured) a valid shipping
        choice — same rules stripe-create-checkout applies, minus the
        price/Connect checks since nothing is charged. Creates an orders
        row (amount_total_cents 0, status inserted straight to 'paid') and
        an order_items row (unit_price_cents/platform_fee_cents 0,
        transfer_status 'transferred') so CommerceRepository.fetchPurchases/
        fetchSales and "already owned" checks elsewhere keep working
        unchanged, then sets the listing's is_sold_out true. See
        CommerceRepository.claimListing, utils/purchase_flow.dart's
        runClaimFlow.
      security: [{ apiKeyAuth: [], bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string }
                shipping:
                  type: object
                  description: "Present when the listing has shipping_methods configured — same shape as stripe-create-checkout's per-listing shipping entry."
                  properties:
                    method: { type: string, enum: [pickup, delivery, meetup] }
                    meetupPlace: { type: string, description: "Required when method is 'meetup'." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orderId: { type: string, format: uuid }
        "400": { description: "Not Free/Swap, own listing, already claimed, or missing/invalid shipping choice" }
        "401": { description: Missing/invalid session }
        "404": { description: Listing not found }

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: The project's publishable/anon key (SUPABASE_ANON_KEY).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The signed-in user's session access token (or the anon key itself for unauthenticated RLS-permitted reads).

  parameters:
    select:
      name: select
      in: query
      description: PostgREST column-selection syntax, e.g. `select=id,title`.
      schema: { type: string }
    idFilter:
      name: id
      in: query
      description: 'PostgREST filter syntax, e.g. `id=eq.p1`.'
      schema: { type: string }

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true, description: "Local file path today — no upload backend, see database.md's 'no file storage' note." }
        cover_image_url: { type: string, nullable: true, description: "Local file path today — same caveat as avatar_url." }
        bio: { type: string, default: "" }
        followers_count: { type: integer, default: 0 }
        following_count: { type: integer, default: 0 }
        posts_count: { type: integer, default: 0 }
        earnings: { type: number, default: 0, description: "Display-only — not a real accrued balance, no payment system exists." }
        is_verified: { type: boolean, default: false }
        created_at: { type: string, format: date-time }

    Post:
      type: object
      required: [id, author_id, title, content, category]
      properties:
        id: { type: string }
        author_id: { type: string }
        title: { type: string }
        content: { type: string }
        category: { type: string, description: "One of the 12 ContentCategory enum names, e.g. poem, novel, haiku." }
        created_at: { type: string, format: date-time }
        likes_count: { type: integer, default: 0 }
        comments_count: { type: integer, default: 0 }
        shares_count: { type: integer, default: 0 }
        audio_url: { type: string, nullable: true, description: "Demo/rotating URL today, not a real upload." }
        cover_image_url: { type: string, nullable: true }
        linked_listing_id: { type: string, nullable: true }
        book_id: { type: string, nullable: true }

    PostPage:
      type: object
      required: [post_id, position, content]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string }
        position: { type: integer, description: "0-based order among a post's extra pages, after its main title/content." }
        title: { type: string, nullable: true, description: "Null when the writer chose not to show a title on this page." }
        content: { type: string }

    Comment:
      type: object
      required: [id, post_id, author_id, text]
      properties:
        id: { type: string }
        post_id: { type: string }
        author_id: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
        likes_count: { type: integer, default: 0 }

    MarketplaceListing:
      type: object
      required: [id, title, author_name, price, type]
      properties:
        id: { type: string }
        title: { type: string }
        author_name: { type: string }
        price: { type: string, description: "Display string, e.g. \"$12.99\" — kept for existing UI code. price_cents is the source of truth for anything that touches money." }
        price_cents: { type: integer, default: 0, description: "Added 2026-08-13. Canonical amount in cents — what stripe-create-checkout actually charges. Backfilled from price for pre-existing rows." }
        type: { type: string, enum: [physical, ebook, audio] }
        rating: { type: number, default: 0 }
        review_count: { type: integer, default: 0 }
        linked_post_id: { type: string, nullable: true }
        content_category: { type: string, nullable: true }
        genre: { type: string, nullable: true }
        description: { type: string, default: "" }
        pdf_file_name: { type: string, nullable: true, description: "Filename only — the file itself is never uploaded anywhere." }
        ebook_content: { type: string, nullable: true, description: "Legacy flat blob, superseded by ebook_chapters." }
        seller_id: { type: string, nullable: true, description: "Defaults to auth.uid(); NULL on the original seed rows." }
        cover_image_url: { type: string, nullable: true, description: "Added 2026-08-07 for the legacy Firebase import; now also set by the List a Book sheet's Cover step (picked photo) — a local file path on device, not an uploaded URL, see database.md's 'no file storage' note." }
        cover_color: { type: integer, nullable: true, description: "Added 2026-08-10. ARGB int for the Cover step's 'design a cover' alternative — the gradient cover color used when no photo was picked." }
        isbn: { type: string, nullable: true, description: "Added 2026-08-13. Physical and E-Book listings only — set by the List a Book sheet." }
        publisher: { type: string, nullable: true, description: "Added 2026-08-13. Physical and E-Book listings only." }
        publication_date: { type: string, format: date, nullable: true, description: "Added 2026-08-13. Physical and E-Book listings only." }
        condition: { type: string, nullable: true, enum: [brandNew, likeNew, good, fair], description: "Added 2026-08-13. Physical listings only." }
        edition: { type: string, nullable: true, description: "Added 2026-08-13. Physical listings only — free-text edition/language, e.g. \"1st Edition, English\"." }
        shipping_methods: { type: array, items: { type: string, enum: [pickup, delivery, meetup] }, default: [], description: "Added 2026-08-13. Physical listings only — which fulfillment methods the seller supports; the buyer picks one of these at checkout (see order_items.shipping_method)." }
        pickup_location: { type: string, nullable: true, description: "Added 2026-08-13. Required in the List a Book sheet when 'pickup' is checked in shipping_methods." }
        pickup_phone: { type: string, nullable: true, description: "Added 2026-08-13. Required alongside pickup_location. Shown to buyers only once they own the listing (or it's their own) — see listing_detail_screen.dart's _DetailsSection." }
        meetup_location: { type: string, nullable: true, description: "Added 2026-08-13. Required in the List a Book sheet when 'meetup' is checked in shipping_methods — the seller's general meeting area; the buyer still suggests a specific place/time per order (order_items.meetup_place)." }
        meetup_phone: { type: string, nullable: true, description: "Added 2026-08-13. Required alongside meetup_location. Shown to buyers only once they own the listing (or it's their own), same gating as pickup_phone." }
        offer: { type: string, enum: [sale, free, swap], default: sale, description: "Added 2026-08-13. Physical listings only (E-Book/Audio are always 'sale') — the Books section's Free/Swap filter row reads this. See swap_wanted_for and is_sold_out." }
        swap_wanted_for: { type: string, nullable: true, description: "Added 2026-08-13. Optional free-text description of what the seller wants in return, meaningful only when offer is 'swap' — blank means \"open to offers\"." }
        qty: { type: integer, nullable: true, description: "Added 2026-08-07 as a legacy Firebase-import carryover, unused until 2026-08-13: now the 'Quantity Available' field on Physical listings in the List a Book sheet." }
        is_sold_out: { type: boolean, default: false, description: "Added 2026-08-07, first actually read/written by the app 2026-08-13: set true by /functions/v1/claim-listing once a Free/Swap listing is claimed, so it stops showing as claimable. Not used by Sale listings, which can be bought repeatedly." }
        created_at: { type: string, format: date-time, description: "Added 2026-08-07." }
        updated_at: { type: string, format: date-time, description: "Added 2026-08-07." }

    EbookChapter:
      type: object
      required: [listing_id, position, title, content]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string }
        position: { type: integer }
        title: { type: string }
        content: { type: string }

    AudioVolume:
      type: object
      required: [listing_id, position, title, file_name]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string }
        position: { type: integer }
        title: { type: string }
        file_name: { type: string, description: "Filename only — not an uploaded/hosted file." }

    Follow:
      type: object
      required: [follower_id, followee_id]
      properties:
        follower_id: { type: string }
        followee_id: { type: string }
        created_at: { type: string, format: date-time }

    Conversation:
      type: object
      required: [id, peer_id]
      properties:
        id: { type: string }
        peer_id: { type: string }
        context_label: { type: string, nullable: true, description: "Set for marketplace-originated threads, e.g. a listing title." }
        created_at: { type: string, format: date-time }
        has_unread: { type: boolean, default: false }
        unread_count: { type: integer, default: 0 }
        owner_id: { type: string, nullable: true, description: "Defaults to auth.uid(); NULL on the original seed rows (now invisible under RLS)." }

    Message:
      type: object
      required: [conversation_id, text]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string }
        text: { type: string }
        from_me: { type: boolean, default: false }
        sent_at: { type: string, format: date-time }
        is_read: { type: boolean, default: false }
        sender_id: { type: string, nullable: true, description: "Defaults to auth.uid()." }

    UserStripeAccount:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, description: "Primary key, references users(id)." }
        stripe_customer_id: { type: string, nullable: true, description: "Set by stripe-create-checkout the first time this user buys something." }
        stripe_connect_account_id: { type: string, nullable: true, description: "Set by stripe-connect-onboarding the first time this user starts seller onboarding." }
        charges_enabled: { type: boolean, default: false, description: "Kept in sync by stripe-webhook's account.updated handler. stripe-create-checkout refuses to sell a listing whose seller isn't charges_enabled." }
        details_submitted: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Order:
      type: object
      required: [id, buyer_id, amount_total_cents]
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string }
        status: { type: string, enum: [pending, paid, failed, refunded], default: pending }
        stripe_payment_intent_id: { type: string, nullable: true }
        amount_total_cents: { type: integer, description: "Sum of every order_items.unit_price_cents in this order." }
        currency: { type: string, default: usd }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderItem:
      type: object
      required: [id, order_id, listing_id, seller_id, unit_price_cents]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        listing_id: { type: string }
        seller_id: { type: string, description: "Snapshot of the listing's seller_id at purchase time — protects order history if the listing is later edited/deleted." }
        unit_price_cents: { type: integer, description: "Snapshot of the listing's price_cents at purchase time." }
        platform_fee_cents: { type: integer, default: 0, description: "Flat 10% today (PLATFORM_FEE_BPS in stripe-create-checkout) — taken out of the seller's Transfer, not billed separately." }
        stripe_transfer_id: { type: string, nullable: true, description: "Set once stripe-webhook successfully transfers this item's payout to the seller's connected account." }
        transfer_status: { type: string, enum: [pending, transferred, failed], default: pending }
        shipping_method: { type: string, nullable: true, enum: [pickup, delivery, meetup], description: "Added 2026-08-13. The buyer's fulfillment choice, set by stripe-create-checkout — only present when the listing is Physical and the seller configured shipping_methods." }
        meetup_place: { type: string, nullable: true, description: "Added 2026-08-13. The buyer's suggested meetup place/time, required when shipping_method is 'meetup'." }
        meetup_confirmed: { type: boolean, default: false, description: "Added 2026-08-13. Flipped true by /functions/v1/confirm-meetup once the seller confirms the meetup — see CommerceRepository.confirmMeetup, sales_tab.dart." }
        created_at: { type: string, format: date-time }
